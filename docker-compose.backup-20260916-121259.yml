version: '3'

services:
  # Generator service that creates synthetic authentication events
  generator:
    build: .
    container_name: siem-generator
    restart: unless-stopped
    volumes:
      - ./scripts:/app/scripts
    command: python /app/scripts/generator.py

  # Loki log aggregation and storage
  loki:
    image: grafana/loki:2.9.1
    container_name: siem-loki
    restart: unless-stopped
    ports:
      - "9090:9090"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml
      - ./loki/data:/tmp/loki

  # Grafana dashboard for visualization
  grafana:
    image: grafana/grafana:11.4.0
    container_name: siem-grafana
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    user: "1000:50"

  # Alloy observability agent
  alloy:
    image: alloy:latest
    container_name: siem-alloy
    restart: unless-stopped
    depends_on:
      - generator
      - loki
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
